<!-- /src/app/layouts/classic-layout/classic-layout.html -->
<div class="flex min-h-screen bg-slate-50">
  <!-- Sidebar -->
  <aside 
    class="fixed inset-y-0 left-0 z-30 w-64 bg-slate-900 transform transition-transform duration-300 ease-out lg:translate-x-0 lg:static lg:w-64"
    [class.-translate-x-full]="!sidebarOpen"
    [class.translate-x-0]="sidebarOpen"
  >
    <!-- Logo -->
    <div class="flex items-center h-16 px-6 border-b border-slate-800">
      <h1 class="text-lg font-semibold text-white tracking-tight">Prestamos</h1>
    </div>
    
    <!-- Navigation -->
    <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
      <!-- Dashboard -->
      <a 
        routerLink="/dashboard" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherHome" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Dashboard</span>
      </a>
      
      <!-- Seccion: Gestion Propia -->
      <div class="pt-6 pb-2">
        <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Gestion Propia</p>
      </div>
      
      <a 
        routerLink="/mis-prestamos" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherDollarSign" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Mis Prestamos</span>
      </a>
      
      <a 
        routerLink="/mis-pagos" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherCreditCard" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Mis Pagos</span>
      </a>
      
      <a 
        routerLink="/clientes" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherUsers" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Clientes</span>
      </a>
      
      <!-- Seccion: Prestamistas y Rutas -->
      <div class="pt-6 pb-2">
        <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Prestamistas</p>
      </div>
      
      <a 
        routerLink="/prestamistas" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherUser" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Prestamistas</span>
      </a>
      
      <a 
        routerLink="/rutas" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherMap" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Rutas</span>
      </a>
      
      <a 
        routerLink="/prestamos-prestamistas" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherDollarSign" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Por Ruta</span>
      </a>
      
      <a 
        routerLink="/liquidacion" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherFileText" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Liquidacion</span>
      </a>
      
      <!-- Seccion: Reportes -->
      <div class="pt-6 pb-2">
        <p class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Reportes</p>
      </div>
      
      <a 
        routerLink="/seguimiento" 
        routerLinkActive="bg-slate-800 text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200"
        (click)="closeIfMobile()"
      >
        <ng-icon name="featherTrendingUp" class="text-lg"></ng-icon>
        <span class="text-sm font-medium">Seguimiento</span>
      </a>
    </nav>
  </aside>

  <!-- Overlay for mobile -->
  <div 
    *ngIf="sidebarOpen" 
    class="fixed inset-0 z-20 bg-slate-900/50 backdrop-blur-sm lg:hidden"
    (click)="closeSidebar()"
  ></div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-h-screen lg:ml-0 overflow-y-auto">
    <!-- Top Navbar -->
    <header class="sticky top-0 z-10 flex items-center h-16 px-4 bg-white/80 backdrop-blur-md border-b border-slate-100">
      <button 
        class="p-2 -ml-2 rounded-lg text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition-colors lg:hidden"
        (click)="toggleSidebar($event)"
      >
        <ng-icon name="featherMenu" class="text-xl"></ng-icon>
      </button>
      
      <div class="flex-1"></div>
      
      <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-slate-600">Usuario</span>
        <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
          <ng-icon name="featherUser" class="text-slate-500"></ng-icon>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 p-3 sm:p-4 md:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
