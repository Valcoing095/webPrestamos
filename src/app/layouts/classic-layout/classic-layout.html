<!-- /src/app/layouts/classic-layout/classic-layout.html -->
<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar" [class.open]="sidebarOpen">
    <div class="p-3 border-bottom border-secondary">
      <h4 class="text-white mb-0">Prestamos App</h4>
    </div>
    <ul class="nav flex-column py-2">
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/dashboard" routerLinkActive="active" (click)="closeIfMobile()">
          <ng-icon name="featherHome" class="me-2"></ng-icon><span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/prestamos" routerLinkActive="active" (click)="closeIfMobile()">
          <ng-icon name="featherDollarSign" class="me-2"></ng-icon><span>Prestamos</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/pagos" routerLinkActive="active" (click)="closeIfMobile()">
          <ng-icon name="featherCreditCard" class="me-2"></ng-icon><span>Pagos</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/personas" routerLinkActive="active" (click)="closeIfMobile()">
          <ng-icon name="featherUsers" class="me-2"></ng-icon><span>Personas (Clientes)</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/prestamistas" routerLinkActive="active" (click)="closeIfMobile()">
          <ng-icon name="featherUser" class="me-2"></ng-icon><span>Prestamistas</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/rutas" routerLinkActive="active" (click)="closeIfMobile()">
          <ng-icon name="featherMap" class="me-2"></ng-icon><span>Rutas</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" routerLink="/seguimiento" routerLinkActive="active" (click)="closeIfMobile()">
          <ng-icon name="featherTrendingUp" class="me-2"></ng-icon><span>Seguimiento</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="main" [class.sidebar-open]="sidebarOpen">
    <!-- Top Navbar -->
    <nav class="navbar navbar-light bg-white border-bottom">
      <div class="container-fluid">
        <button class="btn btn-link" (click)="toggleSidebar($event)">
          <ng-icon name="featherMenu"></ng-icon>
        </button>
        <div class="d-flex align-items-center ms-auto">
          <span class="me-3">Usuario</span>
          <ng-icon name="featherUser"></ng-icon>
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <main class="p-3 p-md-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
